name: Limpieza del ataque (25-10-2026)

on:
  push:
    branches: [main]
    paths: ['limpieza/orden.json']

permissions:
  contents: write

concurrency:
  group: publicar-noticia
  cancel-in-progress: false

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Revisar o limpiar
        env:
          WP_URL: https://enpapel.es
          WP_USER: ${{ secrets.WP_USER || vars.WP_USER || 'Gorka' }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 limpieza/limpiar.py
      - name: Guardar el resultado
        if: always()
        run: |
          git config user.name "EnPapel29N"
          git config user.email "actions@users.noreply.github.com"
          git add limpieza/resultado-*.json || true
          git commit -m "Limpieza: resultado [skip ci]" || exit 0
          git pull --rebase -q && git push
